name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          cp -a /root/.config/godot ~/.config/ 2>/dev/null || true
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Meydan-Nabard.apk
          test -f build/Meydan-Nabard.apk
          ls -lh build/Meydan-Nabard.apk

      - name: Check APK size
        run: |
          SIZE=$(stat -c%s build/Meydan-Nabard.apk)
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -gt 83886080 ]; then
            echo "APK is larger than 80 MiB."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meydan-Nabard-Android
          path: build/Meydan-Nabard.apk
          if-no-files-found: error
